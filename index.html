<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0908" />
    <title>%PAGE_TITLE%</title>
    <meta name="description" content="%OG_DESCRIPTION%" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="bs_BA" />
    <meta property="og:site_name" content="%BRAND%" />

    <style>
      html { background: #000; }
      #boot { position: fixed; inset: 0; z-index: 41; background: #000; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: Anton, Impact, 'Arial Narrow', sans-serif; }
      #boot b { font-weight: 400; font-size: min(40vw, 30vh); line-height: 1; }
      #boot small { font-size: min(12vw, 9vh); color: #e8a17a; vertical-align: top; }
      #boot p { margin: 18px 0 0; font: 500 15px system-ui, sans-serif; color: rgba(255, 255, 255, 0.74); }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true"><div><b>0</b><small>%LOADER_UNIT%</small></div><p>%LOADER_HEATING%</p></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
